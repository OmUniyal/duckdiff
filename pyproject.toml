[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "duckdiff"
version = "0.2.0"
description = "N-way, order-independent comparison of large record files and Python source files, powered by DuckDB."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Om Uniyal" }
]
keywords = ["duckdb", "diff", "comparison", "data-quality", "csv", "parquet", "reconciliation", "ast", "python", "code-diff"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Database",
]
dependencies = [
    "duckdb>=1.0.0",
]

[project.optional-dependencies]
ui = [
    "streamlit>=1.30",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "duckdiff[ui]",
]

[project.scripts]
duckdiff = "duckdiff.cli:main"

[project.urls]
Homepage = "https://github.com/OmUniyal/duckdiff"
Repository = "https://github.com/OmUniyal/duckdiff"
Issues = "https://github.com/OmUniyal/duckdiff/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/duckdiff"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = true

[[tool.mypy.overrides]]
# Third-party stubs pulled in transitively by streamlit use newer syntax
# (PEP 695) than our python_version target -- skip opening them entirely
# rather than trying to type-check or suppress errors from them.
module = ["streamlit", "streamlit.*", "numpy", "numpy.*", "pandas", "pandas.*"]
follow_imports = "skip"
follow_imports_for_stubs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
